name: Skyramp Testbot

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.actor != 'skyramp-testbot[bot]' }}

jobs:
  testbot:
    # Only run for pull_request events or issue_comment on PRs mentioning @skyramp-testbot
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@skyramp-testbot') && github.event.comment.user.login != 'skyramp-testbot[bot]')
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Generate GitHub App Token
        id: skyramp-testbot-app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.SKYRAMP_TESTBOT_APP_ID }}
          private-key: ${{ secrets.SKYRAMP_TESTBOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ steps.skyramp-testbot-app-token.outputs.token }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Neutralise the Playwright postinstall (Debian 11 archives are gone)
        run: |
          node -e '
            const fs = require("fs");
            const f = "apps/web/package.json";
            const pkg = JSON.parse(fs.readFileSync(f, "utf8"));
            if (!/playwright install/.test(pkg.scripts.postinstall || "")) {
              throw new Error("postinstall no longer installs Playwright: " + pkg.scripts.postinstall);
            }
            pkg.scripts.postinstall = "echo skipping playwright browser install for the SUT image";
            fs.writeFileSync(f, JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Let apt use the expired bullseye-security index
        run: |
          node -e '
            const fs = require("fs");
            const f = "Dockerfile";
            const src = fs.readFileSync(f, "utf8");
            const hits = src.match(/apt-get update/g) || [];
            if (hits.length === 0) throw new Error("Dockerfile no longer runs apt-get update");
            fs.writeFileSync(f, src.replace(/apt-get update/g, "apt-get -o Acquire::Check-Valid-Until=false update"));
          '

      - name: Build linkwarden image from PR source
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: linkwarden:testbot
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: skyramp/testbot@4722126f99847b5ef600de0a4b26e3349fa0eafe # v0.11.12
        with:
          skyrampLicenseFile: ${{ secrets.SKYRAMP_LICENSE_FILE }}
          anthropicApiKey: ${{ secrets.SKYRAMP_TESTBOT_API_KEY }}
          githubToken: ${{ steps.skyramp-testbot-app-token.outputs.token }}
          githubAppId: ${{ secrets.SKYRAMP_TESTBOT_APP_ID }}
          githubAppPrivateKey: ${{ secrets.SKYRAMP_TESTBOT_APP_PRIVATE_KEY }}
          skyrampMcpVersion: '0.4.1-rc.1'
          skyrampExecutorVersion: 'v1.3.44'
          targetSetupCommand: 'bash .skyramp/sut/setup.sh'
          targetReadyCheckCommand: 'curl -sf http://localhost:3000/'
          targetReadyCheckTimeout: '1800'
          targetReadyCheckDiagnosticsCommand: 'docker compose -f .skyramp/sut/docker-compose.testbot.yml --project-directory . ps && docker compose -f .skyramp/sut/docker-compose.testbot.yml --project-directory . logs --tail=50'
          targetTeardownCommand: 'docker compose -f .skyramp/sut/docker-compose.testbot.yml --project-directory . down -v'
          authTokenCommand: 'bash .skyramp/sut/get-auth-token.sh'
