services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testbotpassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12.8
    environment:
      MEILI_MASTER_KEY: testbotmasterkey
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"

  linkwarden:
    image: linkwarden:testbot
    environment:
      DATABASE_URL: postgresql://postgres:testbotpassword@postgres:5432/postgres
      POSTGRES_PASSWORD: testbotpassword
      NEXTAUTH_SECRET: testbotnextauthsecret
      NEXTAUTH_URL: http://localhost:3000/api/v1/auth
      NEXT_PUBLIC_CREDENTIALS_ENABLED: "true"
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: testbotmasterkey
      STORAGE_FOLDER: /data/data
    ports:
      - "3000:3000"
    volumes:
      - linkwarden_data:/data/data
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started

volumes:
  linkwarden_data: